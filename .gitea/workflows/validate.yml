name: Validate

# Runs on a self-hosted Gitea act_runner. The GitHub copy of this repository
# runs .github/workflows/tests.yml on every push instead; that job is gated to
# GitHub so it never lands on this runner.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Anything that
# installs Home Assistant is workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships Python 3.10.12, which cannot parse the PEP 695
      # `type X = ...` statements this integration uses; the offline validator
      # runs ast.parse over every module, so it needs the same 3.14 the
      # Home Assistant job uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pinned: an unpinned linter makes CI non-reproducible, and this exact
      # failure has already been paid for once on the sleepiq repo.
      - name: Install ruff (PINNED)
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          python3 -m ruff --version

      - name: Ruff
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: JSON is valid
        run: |
          for f in custom_components/att_router_reboot/*.json hacs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      # Manifest, translations, actions, icons, exceptions and the quality
      # scale against the pinned rule list, all offline.
      - name: Offline validator
        run: python3 tools/validate_local.py

  # Installs Home Assistant, so it is manual only and never occupies the shared
  # runner on an ordinary push. This is the job that runs tests/ha/.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships 3.10; Home Assistant 2026.x needs 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Same pins as .github/workflows/tests.yml. The harness brings pytest,
      # pytest-cov, the asyncio and aiohttp plugins and Pillow; pinning them
      # again makes pip's resolution impossible.
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "mypy==1.18.2" \
            "pytest-homeassistant-custom-component==0.13.357"

      # Same two-stage coverage run as the GitHub workflow: the pure suite
      # covers the parser and the client that the Home Assistant tests mock
      # out, and the 95% gate is on the total.
      - name: Pure tests (parser + client, no Home Assistant)
        run: |
          python -m pytest tests/test_parse.py tests/test_api.py -q -p no:homeassistant \
            --cov=custom_components/att_router_reboot --cov-report=

      - name: Home Assistant layer tests
        run: |
          python -m pytest tests/ha -q --cov-append \
            --cov=custom_components/att_router_reboot \
            --cov-report=term-missing --cov-fail-under=95

      - name: mypy strict
        run: python -m mypy custom_components/att_router_reboot

      - name: Offline validator
        run: python tools/validate_local.py

  hacs:
    name: hassfest + HACS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
