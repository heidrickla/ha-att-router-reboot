name: Validate

# The Gitea mirror runs this file. .github/workflows/tests.yml is gated to
# GitHub and never runs here. Jobs that install Home Assistant are
# workflow_dispatch only, so an ordinary push runs one fast job.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15

      # The runner image ships Python 3.10.12, which cannot parse the PEP 695
      # `type X = ...` statements this integration uses; the offline validator
      # runs ast.parse over every module, so it needs the same 3.14 the
      # Home Assistant job uses.
      - uses: actions/setup-python@v5
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install ruff (PINNED)
        timeout-minutes: 15
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          python3 -m ruff --version

      - name: Ruff
        timeout-minutes: 15
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: JSON is valid
        timeout-minutes: 15
        run: |
          for f in custom_components/att_router_reboot/*.json hacs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      # Manifest, translations, actions, icons, exceptions and the quality
      # scale against the pinned rule list, all offline.
      - name: Offline validator
        timeout-minutes: 15
        run: python3 tools/validate_local.py

  # Installs Home Assistant, so it is workflow_dispatch only. Runs tests/ha/.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15

      # The runner image ships 3.10; Home Assistant 2026.x needs 3.14.
      - uses: actions/setup-python@v5
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # Same pins as .github/workflows/tests.yml. The harness brings pytest,
      # pytest-cov, the asyncio and aiohttp plugins and Pillow; pinning them
      # again makes the resolution impossible. A venv outside the checkout:
      # the runner's setup-python toolcache is shared with other repos' jobs,
      # and the validator reads untracked files. uv installs the same packages
      # as pip did (compared 2026-10-30) in a quarter of the time; 0.11.31 is
      # the uv the harness itself pins.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "uv==0.11.31"
          "$RUNNER_TEMP/venv/bin/python" -m uv pip install --quiet \
            --python "$RUNNER_TEMP/venv/bin/python" \
            "mypy==1.18.2" "pytest-homeassistant-custom-component==0.13.357"

      # Same two-stage coverage run as the GitHub workflow: the pure suite
      # covers the parser and the client that the Home Assistant tests mock
      # out, and the 95% gate is on the total.
      - name: Pure tests (parser + client, no Home Assistant)
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest --durations=15 --junitxml=reports/junit-1.xml tests/test_parse.py tests/test_api.py -q -p no:homeassistant \
            --cov=custom_components/att_router_reboot --cov-report=

      - name: Home Assistant layer tests
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest --durations=15 --junitxml=reports/junit-2.xml tests/ha -q --cov-append \
            --cov=custom_components/att_router_reboot \
            --cov-report=term-missing --cov-fail-under=95

      - name: mypy strict
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" -m mypy custom_components/att_router_reboot'

      - name: Offline validator
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" tools/validate_local.py'

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14

  # hacs/action reads the repository through the GitHub API, so it cannot
  # check this tree here; .github/workflows/tests.yml runs it on GitHub.
  hassfest:
    name: hassfest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - uses: home-assistant/actions/hassfest@master
        timeout-minutes: 15
