[project]
name = "ha-att-router-reboot"
# Kept equal to manifest.json and const.VERSION; tools/validate_local.py checks.
version = "0.2.1"
description = "Home Assistant integration that reboots an AT&T residential gateway."
# Home Assistant 2026.8.3 declares requires-python >=3.14.2 and CI installs
# 3.14. What a user has to meet is the Home Assistant floor in hacs.json.
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 88
# The interpreter CI installs, which [tool.mypy] pins as python_version.
target-version = "py314"
extend-exclude = ["custom_components/att_router_reboot/brand"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The test file is a linear check script rather than a module.
"tests/*" = ["S101", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/winposix.py replaces fcntl and resource before Home Assistant is
# imported, which a conftest is too late to do; pytest handles -p before
# entry point plugins. Every function in it returns immediately off Windows.
addopts = "-p tests.winposix"

# `strict-typing` is the Platinum rule with teeth. This is Home Assistant
# core's generated mypy.ini [mypy] block at 2026.8.3, plus `strict`, which
# covers the flags core lists individually. Dropped from core's block:
# plugins, native_parser and num_workers, which are core-tree settings, and
# warn_incomplete_stub, because core type-checks its own stubs.
# Run it against an environment that has Home Assistant installed; without one
# every class it exports is Any and the result says nothing.
[tool.mypy]
python_version = "3.14"
# A Windows workstation run and the Linux CI run resolve the same platform
# branches.
platform = "linux"
strict = true
local_partial_types = true
no_implicit_optional = true
strict_bytes = true
# The only flag that reports a guard the lifecycle makes unreachable.
warn_unreachable = true
# Core's explicit value; `strict` would otherwise turn it on.
extra_checks = false
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
# Core's exact three. Broader suppression cannot tell an unresolvable import
# from an untyped one.
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
follow_imports = "normal"
show_error_codes = true

# The tests are not the integration; CI checks custom_components/<domain> and
# never reaches here. `strict` is not a per-module key: mypy 1.18.2 accepts a
# section containing it without a warning and discards the whole section,
# taking the relaxations beside it.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
