[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["custom_components/att_router_reboot/brand"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The test file is a linear check script rather than a module.
"tests/*" = ["S101", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/winposix.py replaces fcntl and resource before Home Assistant is
# imported, which a conftest is too late to do; pytest handles -p before
# entry point plugins. Every function in it returns immediately off Windows.
addopts = "-p tests.winposix"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. Nothing below relaxes strict.
# Without Home Assistant installed every class it exports is Any, so a local
# run reports a handful of "subclassing Any" and "returning Any" lines that
# are artefacts of the missing install; the CI job, which installs Home
# Assistant, is the run that counts.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14; a lower target makes mypy stop at
# its own source before it reaches this integration.
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
