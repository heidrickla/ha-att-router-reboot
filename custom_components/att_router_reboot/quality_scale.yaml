rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      The reboot action is registered in async_setup, not per entry, so a call
      while the entry is unloaded gets a translated refusal. It takes no
      fields: the integration allows one entry.
  appropriate-polling:
    status: done
    comment: |
      Two-minute poll of an unauthenticated status page. Uptime and WAN state
      do not move faster than that, and the gateway is doing real routing work.
  brands:
    status: done
    comment: |
      Brand images ship in-repo at custom_components/att_router_reboot/brand/
      (generated and size-checked by tools/make_brand.py), which Home
      Assistant serves since 2026.3; hacs.json carries that floor. A core
      submission would add them to home-assistant/brands instead.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, each of the three
      errors followed by recovery to CREATE_ENTRY, the single-instance abort,
      reconfigure (success, blank code keeps the stored one, each error then
      recovery, another gateway refused, no stored code on the form), reauth
      (success, each error then recovery) and the options flow. Run by the
      GitHub Tests workflow against Home Assistant 2026.8.3 on every push.
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      requirements is empty. The client is aiohttp (already in Home Assistant)
      plus the standard library; there is nothing to be transparent about.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities are coordinator-driven; CoordinatorEntity subscribes in
      async_added_to_hass and unsubscribes on removal. None manage a
      subscription of their own beyond that.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The flow logs in against the gateway and then insists on the restart
      form as the proof (api.AttRouterClient._restart_form). The
      cookies-disabled stub and a re-served login form both fail; a missing
      password field alone is no longer read as success.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh raises ConfigEntryNotReady while the
      gateway is unreachable or serves a page the parser cannot read. Core
      2026.8.3 raises it bare, with the translated UpdateFailed only as the
      cause, so async_setup_entry catches it and re-raises a ConfigEntryNotReady
      carrying the cause's translation key and placeholders. tests/ha/test_init.py
      asserts the key and placeholders reach the entry.
  unique-config-entry:
    status: done
    comment: |
      single_config_entry in the manifest; the host is also set as the unique
      id so the reconfigure flow can refuse a different gateway.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Every reboot path goes through AttRouterCoordinator.async_reboot, which
      raises a translated HomeAssistantError; the action raises a translated
      ServiceValidationError while the entry is unloaded.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Coordinator failure marks everything unavailable except Reachable,
      which stays available so the fault itself is visible.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator logs the unreachable gateway once when the poll
      first fails and once at info when it recovers.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: |
      The access code is only used to reboot, so that is where a changed code
      shows: AttRouterCoordinator.async_reboot starts the reauth flow on
      AttRouterAuthError from the button, the action or the schedule.
  test-coverage:
    status: done
    comment: |
      The GitHub Tests workflow measures both suites into one coverage file -
      the pure parser and client tests with --cov, then tests/ha with
      --cov-append - and fails the run below 95% (--cov-fail-under=95).
      Measuring either suite alone understates the integration, because the
      Home Assistant tests mock the client the pure tests exercise.

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: |
      Access code, host, serial, MAC and the WAN IPv4 address are redacted;
      the poll data is converted with dataclasses.asdict first so the nested
      address is reached.
  discovery:
    status: todo
    comment: |
      The gateway is at a well-known fixed address, but BGW-series gateways
      advertise UPnP IGD over SSDP by default, so the rule's exemption (the
      device cannot be discovered) is not available. An SSDP matcher needs the
      unit's own deviceType, manufacturer and modelName strings, and those can
      only be read from a host on the gateway's LAN - VLAN 54, where this
      repository is worked on, has no route to 192.168.1.254. Nothing here is
      guessed: a matcher built on a plausible-looking service type would claim
      other vendors' routers. Blocked until someone runs an SSDP M-SEARCH from
      the Home Assistant VM and records the strings.
  discovery-update-info:
    status: todo
    comment: |
      Follows discovery: without a discovery flow there is nothing to carry a
      new address in. The unique id is the host today, so adopting discovery
      also means moving it to the gateway's serial (sysinfo.ha reports one)
      before an address change can update an existing entry.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: A single fixed device - the one gateway the entry configures.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      The handful of entities are all useful on a device whose whole reason for
      being added is to watch and reboot it. The byte counters change every
      poll, but core's fritz keeps its own enabled for the same reason: they
      are what a router page is for.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      UpdateFailed, HomeAssistantError and ServiceValidationError are raised
      with translation keys. The bare ConfigEntryNotReady from the first
      refresh is caught in async_setup_entry and re-raised with the cause's
      key and placeholders, because the released core reads the reason from
      the exception itself and not from its cause. tools/validate_local.py
      fails on any call without a translation key.
  icon-translations:
    status: done
    comment: |
      The WAN address and the error counters have no device class, so
      icons.json supplies theirs. The byte counters carry data_size, whose
      core icon is a generic mdi:database; they override it on purpose with
      directional download and upload icons, as core's fritz does. The reboot
      button, uptime, line rate and both connectivity sensors take the
      device-class icon.
  reconfiguration-flow:
    status: done
    comment: |
      Access code and certificate check can change in place; the stored code
      is never sent back to the form and a blank keeps it. The unique id is
      the host, so a gateway at a new address is another gateway and is
      refused - documented in the README.
  repair-issues:
    status: done
    comment: |
      A scheduled reboot fires with nobody watching it, so schedule.py raises
      the scheduled_reboot_failed issue when one fails and deletes it when a
      later one succeeds. The text says what the user can check and how to
      stop being told. A rejected access code is excluded: it starts the
      reauth flow instead, which is the better prompt, and two notices for one
      fault would be noise. Every other fault (an unreachable gateway, an
      unreadable page) is ordinary unavailability with a user watching, which
      the rule says not to raise an issue for.
  stale-devices:
    status: exempt
    comment: A single fixed device that is removed with the entry.

  # Platinum
  async-dependency:
    status: done
    comment: |
      The client is asyncio on aiohttp, in-repo (api.py, parse.py and
      models.py, free of Home Assistant imports). When it is lifted into a
      PyPI package for a core submission it stays async.
  inject-websession:
    status: done
    comment: |
      async_create_clientsession, in setup and in the config flow, with
      cookie_jar=aiohttp.CookieJar(unsafe=True): the rule's own case for a
      session that must carry cookies. A dedicated session rather than the
      shared one because the gateway's SessionID cookie must not leak into
      other integrations' requests, and unsafe because the gateway is
      addressed by IP and the default jar drops cookies from IP hosts.
  strict-typing:
    status: done
    comment: |
      pyproject.toml runs mypy strict with no relaxations, and the GitHub
      Tests workflow runs it on Python 3.14 with Home Assistant 2026.8.3
      installed, which is the run that means something: "Success: no issues
      found in 14 source files" on run 33923274528. runtime-data uses the
      typed AttRouterConfigEntry alias throughout. The rule's PEP-561 half is
      about a separate library; the client here is in-repo and typed with the
      rest of the integration, and the .strict-typing registration it also
      asks for is a file in core, which a custom integration has no entry in.
