name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo, publishes, or comments on a PR.
permissions: {}

# A Gitea mirror also reads .github/workflows, so every job here is gated to
# GitHub. Elsewhere these skip instantly and .gitea/workflows/validate.yml is
# the one that runs.

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3; it
      # brings pytest, pytest-cov (7.1.0), its asyncio and aiohttp plugins,
      # PyYAML and Pillow (12.3.0, which the validator uses for brand sizes)
      # with it. Pinning any of those again here makes the resolution
      # impossible, so none of them appear below. uv installs the same
      # packages as pip did (compared 2026-10-30) in a quarter of the time;
      # 0.11.31 is the uv the harness itself pins.
      - run: |
          python -m pip install "uv==0.11.31"
          python -m uv pip install --system "mypy==1.18.2" "ruff==0.15.21" \
            "pytest-homeassistant-custom-component==0.13.357"
      - run: ruff check .
      - run: ruff format --check .
      # Coverage spans both suites and the gate is on the total. The pure
      # suite covers the parser and the client, which the Home Assistant tests
      # mock out; either figure alone understates the integration.
      - run: |
          python -m pytest tests/test_parse.py tests/test_api.py -q -p no:homeassistant \
            --cov=custom_components/att_router_reboot --cov-report=
      - run: |
          python -m pytest tests/ha -q --cov-append \
            --cov=custom_components/att_router_reboot \
            --cov-report=term-missing --cov-fail-under=95
      - run: python -m mypy custom_components/att_router_reboot
      - run: python tools/validate_local.py

  hassfest-hacs:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
