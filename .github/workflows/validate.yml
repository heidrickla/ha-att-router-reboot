name: Validate

# GitHub Actions mirror of .gitea/workflows/validate.yml. Public repositories
# get hosted runners for free, so every job runs on every push here; the Gitea
# copy keeps the heavy jobs behind workflow_dispatch because its runner is
# shared.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install ruff (PINNED)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ruff==0.15.21"
          python -m ruff --version

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: JSON is valid
        run: |
          for f in custom_components/att_router_reboot/*.json hacs.json; do
            python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        run: |
          python - <<'PY'
          import json
          m = json.load(open("custom_components/att_router_reboot/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "att_router_reboot", m["domain"]
          # A custom integration without a version silently fails to load.
          assert m["version"], "version is required for a custom integration"
          print("manifest ok:", m["domain"], m["version"])
          PY

      - name: Quality scale is complete and honest
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python - <<'PY'
          import json, yaml
          rules = yaml.safe_load(open(
              "custom_components/att_router_reboot/quality_scale.yaml", encoding="utf-8"))["rules"]
          todo = sorted(k for k, v in rules.items()
                        if isinstance(v, dict) and v.get("status") == "todo")
          for name, v in rules.items():
              if isinstance(v, dict):
                  assert v.get("status") in {"done","todo","exempt"}, name
                  assert str(v.get("comment","")).strip(), f"{name}: needs a reason"
              else:
                  assert v == "done", name
          claimed = json.load(open(
              "custom_components/att_router_reboot/manifest.json", encoding="utf-8")
          ).get("quality_scale")
          assert not (claimed and todo), f"manifest claims {claimed} with todo: {todo}"
          print(f"{len(rules)} rules; still todo: {', '.join(todo) or 'none'}")
          PY

  home-assistant:
    name: Home Assistant layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            pytest pytest-asyncio "mypy==1.18.2" \
            pytest-homeassistant-custom-component

      - name: Pure tests (parser + client, no Home Assistant)
        run: python -m pytest tests/test_parse.py tests/test_api.py -q -p no:homeassistant

      - name: Home Assistant layer tests
        run: python -m pytest tests/ha -q

      - name: mypy strict
        run: python -m mypy custom_components/att_router_reboot

  hacs:
    name: hassfest + HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
        continue-on-error: true
      - uses: hacs/action@main
        continue-on-error: true
        with:
          category: integration
